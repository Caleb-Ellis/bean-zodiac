<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="28 28 200 200" width="600" height="600">
  <defs>
    <filter id="blot" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feTurbulence type="turbulence" baseFrequency="0.0380" numOctaves="2" seed="1614" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="48" xChannelSelector="R" yChannelSelector="G" result="warped" />
      <feGaussianBlur in="warped" stdDeviation="0.75" result="blurred" />
      <feColorMatrix in="blurred" type="matrix" values="0 0 0 0 0.05  0 0 0 0 0.05  0 0 0 0 0.06  0 0 0 1 0" result="inked" />
      <feDisplacementMap in="inked" in2="noise" scale="8" xChannelSelector="G" yChannelSelector="R" result="ragged" />
      <feGaussianBlur in="ragged" stdDeviation="0.6" result="raggedBlur" />
      <feComponentTransfer in="raggedBlur">
        <feFuncA type="linear" slope="6" intercept="-2.0" />
      </feComponentTransfer>
    </filter>
  </defs>
  <g transform="translate(0 0) scale(1 1)">
    <g filter="url(#blot)">
      <g transform="rotate(90 128 128)">
        
    <g>
      <image href="/images/cannellini.svg" x="-72.56" y="-36.16" width="363.52" height="363.52" transform="rotate(-11 109.2 145.6)" />
      <text x="147.2" y="173.2" font-size="91" text-anchor="middle" dominant-baseline="central" transform="rotate(1 147.2 173.2)">🍭</text>
      <text x="140.4" y="99.6" font-size="87" text-anchor="middle" dominant-baseline="central" transform="rotate(12 140.4 99.6)">🔥</text>
    </g>
