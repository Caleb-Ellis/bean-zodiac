      <image href="/images/cannellini.svg" x="-72.56" y="-36.16" width="363.52" height="363.52" transform="rotate(-11 109.2 145.6)" />
      <text x="147.2" y="173.2" font-size="91" text-anchor="middle" dominant-baseline="central" transform="rotate(1 147.2 173.2)">🍭</text>
      <text x="140.4" y="99.6" font-size="87" text-anchor="middle" dominant-baseline="central" transform="rotate(12 140.4 99.6)">🔥</text>
    </g>
        </g>
      </g>
    </g>
  </g>
</svg>
