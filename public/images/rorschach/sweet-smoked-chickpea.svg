<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="28 28 200 200" width="600" height="600">
  <defs>
    <filter id="blot" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feTurbulence type="turbulence" baseFrequency="0.0477" numOctaves="2" seed="9418" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="48" xChannelSelector="R" yChannelSelector="G" result="warped" />
      <feGaussianBlur in="warped" stdDeviation="1.10" result="blurred" />
      <feColorMatrix in="blurred" type="matrix" values="0 0 0 0 0.05  0 0 0 0 0.05  0 0 0 0 0.06  0 0 0 1 0" result="inked" />
      <feDisplacementMap in="inked" in2="noise" scale="8" xChannelSelector="G" yChannelSelector="R" result="ragged" />
      <feGaussianBlur in="ragged" stdDeviation="0.6" result="raggedBlur" />
      <feComponentTransfer in="raggedBlur">
        <feFuncA type="linear" slope="6" intercept="-2.0" />
      </feComponentTransfer>
    </filter>
  </defs>
  <g transform="translate(0 256) scale(1 -1)">
    <g filter="url(#blot)">
      <g transform="rotate(90 128 128)">
        
    <g>
      <image href="/images/chickpea.svg" x="-50.24" y="-11.64" width="340.48" height="340.48" transform="rotate(-9 120 158.6)" />
      <text x="137.8" y="104" font-size="87" text-anchor="middle" dominant-baseline="central" transform="rotate(26 137.8 104)">🍭</text>
      <text x="127.8" y="130.2" font-size="84" text-anchor="middle" dominant-baseline="central" transform="rotate(-34 127.8 130.2)">💨</text>
    </g>
        <g transform="translate(256 0) scale(-1 1)">
          
    <g>
      <image href="/images/chickpea.svg" x="-50.24" y="-11.64" width="340.48" height="340.48" transform="rotate(-9 120 158.6)" />
      <text x="137.8" y="104" font-size="87" text-anchor="middle" dominant-baseline="central" transform="rotate(26 137.8 104)">🍭</text>
      <text x="127.8" y="130.2" font-size="84" text-anchor="middle" dominant-baseline="central" transform="rotate(-34 127.8 130.2)">💨</text>
    </g>
        </g>
      </g>
    </g>
  </g>
</svg>
