<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="28 28 200 200" width="600" height="600">
  <defs>
    <filter id="blot" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feTurbulence type="turbulence" baseFrequency="0.0391" numOctaves="2" seed="7966" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="45" xChannelSelector="R" yChannelSelector="G" result="warped" />
      <feGaussianBlur in="warped" stdDeviation="1.10" result="blurred" />
      <feColorMatrix in="blurred" type="matrix" values="0 0 0 0 0.05  0 0 0 0 0.05  0 0 0 0 0.06  0 0 0 1 0" result="inked" />
      <feDisplacementMap in="inked" in2="noise" scale="7" xChannelSelector="G" yChannelSelector="R" result="ragged" />
      <feGaussianBlur in="ragged" stdDeviation="0.6" result="raggedBlur" />
      <feComponentTransfer in="raggedBlur">
        <feFuncA type="linear" slope="6" intercept="-2.0" />
      </feComponentTransfer>
    </filter>
  </defs>
  <g transform="translate(0 0) scale(1 1)">
    <g filter="url(#blot)">
      <g transform="rotate(90 128 128)">
        
    <g>
      <image href="/images/butter.svg" x="-41.16" y="-32.76" width="325.12" height="325.12" transform="rotate(12 121.4 129.8)" />
      <text x="140.6" y="98.8" font-size="83" text-anchor="middle" dominant-baseline="central" transform="rotate(3 140.6 98.8)">🍄</text>
      <text x="140.2" y="174.4" font-size="74" text-anchor="middle" dominant-baseline="central" transform="rotate(2 140.2 174.4)">🔥</text>
    </g>
        <g transform="translate(256 0) scale(-1 1)">
          
    <g>
      <image href="/images/butter.svg" x="-41.16" y="-32.76" width="325.12" height="325.12" transform="rotate(12 121.4 129.8)" />
      <text x="140.6" y="98.8" font-size="83" text-anchor="middle" dominant-baseline="central" transform="rotate(3 140.6 98.8)">🍄</text>
      <text x="140.2" y="174.4" font-size="74" text-anchor="middle" dominant-baseline="central" transform="rotate(2 140.2 174.4)">🔥</text>
    </g>
        </g>
      </g>
    </g>
  </g>
</svg>
