<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="28 28 200 200" width="600" height="600">
  <defs>
    <filter id="blot" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feTurbulence type="turbulence" baseFrequency="0.0266" numOctaves="2" seed="338" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="51" xChannelSelector="R" yChannelSelector="G" result="warped" />
      <feGaussianBlur in="warped" stdDeviation="1.05" result="blurred" />
      <feColorMatrix in="blurred" type="matrix" values="0 0 0 0 0.05  0 0 0 0 0.05  0 0 0 0 0.06  0 0 0 1 0" result="inked" />
      <feDisplacementMap in="inked" in2="noise" scale="8" xChannelSelector="G" yChannelSelector="R" result="ragged" />
      <feGaussianBlur in="ragged" stdDeviation="0.6" result="raggedBlur" />
      <feComponentTransfer in="raggedBlur">
        <feFuncA type="linear" slope="6" intercept="-2.0" />
      </feComponentTransfer>
    </filter>
  </defs>
  <g transform="translate(0 256) scale(1 -1)">
    <g filter="url(#blot)">
      <g transform="rotate(90 128 128)">
        
    <g>
      <image href="/images/chickpea.svg" x="-54.48" y="-17.88" width="360.96" height="360.96" transform="rotate(24 126 162.6)" />
      <text x="138.8" y="112" font-size="78" text-anchor="middle" dominant-baseline="central" transform="rotate(13 138.8 112)">🍋</text>
      <text x="128.8" y="131.2" font-size="85" text-anchor="middle" dominant-baseline="central" transform="rotate(42 128.8 131.2)">🔥</text>
    </g>
        <g transform="translate(256 0) scale(-1 1)">
          
    <g>
      <image href="/images/chickpea.svg" x="-54.48" y="-17.88" width="360.96" height="360.96" transform="rotate(24 126 162.6)" />
      <text x="138.8" y="112" font-size="78" text-anchor="middle" dominant-baseline="central" transform="rotate(13 138.8 112)">🍋</text>
      <text x="128.8" y="131.2" font-size="85" text-anchor="middle" dominant-baseline="central" transform="rotate(42 128.8 131.2)">🔥</text>
    </g>
        </g>
      </g>
    </g>
  </g>
</svg>
