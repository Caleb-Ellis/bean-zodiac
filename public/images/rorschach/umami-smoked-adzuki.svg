      <text x="125.4" y="98.4" font-size="95" text-anchor="middle" dominant-baseline="central" transform="rotate(-26 125.4 98.4)">🍄</text>
      <text x="147" y="143.8" font-size="73" text-anchor="middle" dominant-baseline="central" transform="rotate(-42 147 143.8)">💨</text>
    </g>
        </g>
      </g>
    </g>
  </g>
</svg>
