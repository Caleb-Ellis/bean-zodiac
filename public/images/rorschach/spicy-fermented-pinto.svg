      <text x="120.4" y="101.4" font-size="87" text-anchor="middle" dominant-baseline="central" transform="rotate(3 120.4 101.4)">🌶️</text>
      <text x="145" y="139.8" font-size="67" text-anchor="middle" dominant-baseline="central" transform="rotate(-13 145 139.8)">🦠</text>
    </g>
