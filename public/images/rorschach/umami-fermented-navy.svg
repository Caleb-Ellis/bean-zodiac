<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="28 28 200 200" width="600" height="600">
  <defs>
    <filter id="blot" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feTurbulence type="turbulence" baseFrequency="0.0334" numOctaves="2" seed="7075" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="46" xChannelSelector="R" yChannelSelector="G" result="warped" />
      <feGaussianBlur in="warped" stdDeviation="0.70" result="blurred" />
      <feColorMatrix in="blurred" type="matrix" values="0 0 0 0 0.05  0 0 0 0 0.05  0 0 0 0 0.06  0 0 0 1 0" result="inked" />
      <feDisplacementMap in="inked" in2="noise" scale="10" xChannelSelector="G" yChannelSelector="R" result="ragged" />
      <feGaussianBlur in="ragged" stdDeviation="0.6" result="raggedBlur" />
      <feComponentTransfer in="raggedBlur">
        <feFuncA type="linear" slope="6" intercept="-2.0" />
      </feComponentTransfer>
    </filter>
  </defs>
  <g transform="translate(0 0) scale(1 1)">
    <g filter="url(#blot)">
      <g transform="rotate(90 128 128)">
        
    <g>
      <image href="/images/navy.svg" x="-30.20" y="-38.80" width="332.80" height="332.80" transform="rotate(30 136.2 127.6)" />
      <text x="127.6" y="156.2" font-size="83" text-anchor="middle" dominant-baseline="central" transform="rotate(22 127.6 156.2)">🍄</text>
      <text x="144.8" y="140.2" font-size="85" text-anchor="middle" dominant-baseline="central" transform="rotate(-18 144.8 140.2)">🦠</text>
    </g>
        <g transform="translate(256 0) scale(-1 1)">
          
    <g>
      <image href="/images/navy.svg" x="-30.20" y="-38.80" width="332.80" height="332.80" transform="rotate(30 136.2 127.6)" />
      <text x="127.6" y="156.2" font-size="83" text-anchor="middle" dominant-baseline="central" transform="rotate(22 127.6 156.2)">🍄</text>
      <text x="144.8" y="140.2" font-size="85" text-anchor="middle" dominant-baseline="central" transform="rotate(-18 144.8 140.2)">🦠</text>
    </g>
        </g>
      </g>
    </g>
  </g>
</svg>
