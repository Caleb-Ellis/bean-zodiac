<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="28 28 200 200" width="600" height="600">
  <defs>
    <filter id="blot" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feTurbulence type="turbulence" baseFrequency="0.0457" numOctaves="2" seed="720" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="38" xChannelSelector="R" yChannelSelector="G" result="warped" />
      <feGaussianBlur in="warped" stdDeviation="0.90" result="blurred" />
      <feColorMatrix in="blurred" type="matrix" values="0 0 0 0 0.05  0 0 0 0 0.05  0 0 0 0 0.06  0 0 0 1 0" result="inked" />
      <feDisplacementMap in="inked" in2="noise" scale="10" xChannelSelector="G" yChannelSelector="R" result="ragged" />
      <feGaussianBlur in="ragged" stdDeviation="0.6" result="raggedBlur" />
      <feComponentTransfer in="raggedBlur">
        <feFuncA type="linear" slope="6" intercept="-2.0" />
      </feComponentTransfer>
    </filter>
  </defs>
  <g transform="translate(0 0) scale(1 1)">
    <g filter="url(#blot)">
      <g transform="rotate(90 128 128)">
        
    <g>
      <image href="/images/chickpea.svg" x="-66.52" y="-47.12" width="368.64" height="368.64" transform="rotate(-20 117.8 137.2)" />
      <text x="133.4" y="170.8" font-size="83" text-anchor="middle" dominant-baseline="central" transform="rotate(19 133.4 170.8)">☕</text>
      <text x="145.4" y="102" font-size="86" text-anchor="middle" dominant-baseline="central" transform="rotate(25 145.4 102)">🦠</text>
    </g>
        <g transform="translate(256 0) scale(-1 1)">
          
    <g>
      <image href="/images/chickpea.svg" x="-66.52" y="-47.12" width="368.64" height="368.64" transform="rotate(-20 117.8 137.2)" />
      <text x="133.4" y="170.8" font-size="83" text-anchor="middle" dominant-baseline="central" transform="rotate(19 133.4 170.8)">☕</text>
      <text x="145.4" y="102" font-size="86" text-anchor="middle" dominant-baseline="central" transform="rotate(25 145.4 102)">🦠</text>
    </g>
        </g>
      </g>
    </g>
  </g>
</svg>
