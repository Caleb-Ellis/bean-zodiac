      <feGaussianBlur in="warped" stdDeviation="1.10" result="blurred" />
      <feColorMatrix in="blurred" type="matrix" values="0 0 0 0 0.05  0 0 0 0 0.05  0 0 0 0 0.06  0 0 0 1.6 -0.2" />
    </filter>
  </defs>
  <g transform="translate(0 256) scale(1 -1)">
