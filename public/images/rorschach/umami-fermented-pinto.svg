<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="28 28 200 200" width="600" height="600">
  <defs>
    <filter id="blot" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feTurbulence type="turbulence" baseFrequency="0.0260" numOctaves="2" seed="1072" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="50" xChannelSelector="R" yChannelSelector="G" result="warped" />
      <feGaussianBlur in="warped" stdDeviation="0.65" result="blurred" />
      <feColorMatrix in="blurred" type="matrix" values="0 0 0 0 0.05  0 0 0 0 0.05  0 0 0 0 0.06  0 0 0 1 0" result="inked" />
      <feDisplacementMap in="inked" in2="noise" scale="7" xChannelSelector="G" yChannelSelector="R" result="ragged" />
      <feGaussianBlur in="ragged" stdDeviation="0.6" result="raggedBlur" />
      <feComponentTransfer in="raggedBlur">
        <feFuncA type="linear" slope="6" intercept="-2.0" />
      </feComponentTransfer>
    </filter>
  </defs>
  <g transform="translate(0 256) scale(1 -1)">
    <g filter="url(#blot)">
      <g transform="rotate(90 128 128)">
        
    <g>
      <image href="/images/pinto.svg" x="-31.68" y="2.72" width="322.56" height="322.56" transform="rotate(16 129.6 164)" />
      <text x="127.4" y="110.4" font-size="102" text-anchor="middle" dominant-baseline="central" transform="rotate(-15 127.4 110.4)">🍄</text>
      <text x="145" y="143.8" font-size="67" text-anchor="middle" dominant-baseline="central" transform="rotate(24 145 143.8)">🦠</text>
    </g>
        <g transform="translate(256 0) scale(-1 1)">
          
    <g>
      <image href="/images/pinto.svg" x="-31.68" y="2.72" width="322.56" height="322.56" transform="rotate(16 129.6 164)" />
      <text x="127.4" y="110.4" font-size="102" text-anchor="middle" dominant-baseline="central" transform="rotate(-15 127.4 110.4)">🍄</text>
      <text x="145" y="143.8" font-size="67" text-anchor="middle" dominant-baseline="central" transform="rotate(24 145 143.8)">🦠</text>
    </g>
        </g>
      </g>
    </g>
  </g>
</svg>
