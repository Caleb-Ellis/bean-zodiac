      <text x="133.6" y="97.8" font-size="87" text-anchor="middle" dominant-baseline="central" transform="rotate(19 133.6 97.8)">🌶️</text>
      <text x="131.2" y="170.4" font-size="80" text-anchor="middle" dominant-baseline="central" transform="rotate(25 131.2 170.4)">💨</text>
    </g>
        </g>
      </g>
    </g>
  </g>
</svg>
