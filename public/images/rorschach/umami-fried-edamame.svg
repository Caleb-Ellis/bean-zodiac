      <text x="131.8" y="101" font-size="90" text-anchor="middle" dominant-baseline="central" transform="rotate(-22 131.8 101)">🍄</text>
      <text x="127.8" y="137.2" font-size="84" text-anchor="middle" dominant-baseline="central" transform="rotate(4 127.8 137.2)">🔥</text>
    </g>
        </g>
      </g>
    </g>
  </g>
</svg>
