      <text x="126.4" y="101.4" font-size="102" text-anchor="middle" dominant-baseline="central" transform="rotate(3 126.4 101.4)">☕</text>
      <text x="144" y="134.8" font-size="72" text-anchor="middle" dominant-baseline="central" transform="rotate(42 144 134.8)">♨️</text>
    </g>
        </g>
      </g>
    </g>
  </g>
</svg>
