      <feGaussianBlur in="ragged" stdDeviation="0.6" result="raggedBlur" />
      <feComponentTransfer in="raggedBlur">
        <feFuncA type="linear" slope="6" intercept="-2.0" />
      </feComponentTransfer>
    </filter>
  </defs>
