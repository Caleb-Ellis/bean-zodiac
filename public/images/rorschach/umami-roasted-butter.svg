<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="28 28 200 200" width="600" height="600">
  <defs>
    <filter id="blot" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feTurbulence type="turbulence" baseFrequency="0.0260" numOctaves="2" seed="485" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="33" xChannelSelector="R" yChannelSelector="G" result="warped" />
      <feGaussianBlur in="warped" stdDeviation="0.75" result="blurred" />
      <feColorMatrix in="blurred" type="matrix" values="0 0 0 0 0.05  0 0 0 0 0.05  0 0 0 0 0.06  0 0 0 1 0" result="inked" />
      <feDisplacementMap in="inked" in2="noise" scale="7" xChannelSelector="G" yChannelSelector="R" result="ragged" />
      <feGaussianBlur in="ragged" stdDeviation="0.6" result="raggedBlur" />
      <feComponentTransfer in="raggedBlur">
        <feFuncA type="linear" slope="6" intercept="-2.0" />
      </feComponentTransfer>
    </filter>
  </defs>
  <g transform="translate(0 0) scale(1 1)">
    <g filter="url(#blot)">
      <g transform="rotate(90 128 128)">
        
    <g>
      <image href="/images/butter.svg" x="-34.84" y="5.56" width="314.88" height="314.88" transform="rotate(-24 122.6 163)" />
      <text x="117.4" y="105.4" font-size="97" text-anchor="middle" dominant-baseline="central" transform="rotate(24 117.4 105.4)">🍄</text>
      <text x="146" y="140.8" font-size="73" text-anchor="middle" dominant-baseline="central" transform="rotate(-6 146 140.8)">♨️</text>
    </g>
        <g transform="translate(256 0) scale(-1 1)">
          
    <g>
      <image href="/images/butter.svg" x="-34.84" y="5.56" width="314.88" height="314.88" transform="rotate(-24 122.6 163)" />
      <text x="117.4" y="105.4" font-size="97" text-anchor="middle" dominant-baseline="central" transform="rotate(24 117.4 105.4)">🍄</text>
      <text x="146" y="140.8" font-size="73" text-anchor="middle" dominant-baseline="central" transform="rotate(-6 146 140.8)">♨️</text>
    </g>
        </g>
      </g>
    </g>
  </g>
</svg>
