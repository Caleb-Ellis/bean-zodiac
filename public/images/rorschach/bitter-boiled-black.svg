<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="28 28 200 200" width="600" height="600">
  <defs>
    <filter id="blot" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feTurbulence type="turbulence" baseFrequency="0.0469" numOctaves="2" seed="9001" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="40" xChannelSelector="R" yChannelSelector="G" result="warped" />
      <feGaussianBlur in="warped" stdDeviation="1.00" result="blurred" />
      <feColorMatrix in="blurred" type="matrix" values="0 0 0 0 0.05  0 0 0 0 0.05  0 0 0 0 0.06  0 0 0 1 0" result="inked" />
      <feDisplacementMap in="inked" in2="noise" scale="9" xChannelSelector="G" yChannelSelector="R" result="ragged" />
      <feGaussianBlur in="ragged" stdDeviation="0.6" result="raggedBlur" />
      <feComponentTransfer in="raggedBlur">
        <feFuncA type="linear" slope="6" intercept="-2.0" />
      </feComponentTransfer>
    </filter>
  </defs>
  <g transform="translate(0 256) scale(1 -1)">
    <g filter="url(#blot)">
      <g transform="rotate(90 128 128)">
        
    <g>
      <image href="/images/black.svg" x="-89.20" y="-55.80" width="396.80" height="396.80" transform="rotate(20 109.2 142.6)" />
      <text x="141.2" y="167.2" font-size="90" text-anchor="middle" dominant-baseline="central" transform="rotate(-25 141.2 167.2)">☕</text>
      <text x="128.4" y="99.6" font-size="83" text-anchor="middle" dominant-baseline="central" transform="rotate(32 128.4 99.6)">💧</text>
    </g>
        <g transform="translate(256 0) scale(-1 1)">
          
    <g>
      <image href="/images/black.svg" x="-89.20" y="-55.80" width="396.80" height="396.80" transform="rotate(20 109.2 142.6)" />
      <text x="141.2" y="167.2" font-size="90" text-anchor="middle" dominant-baseline="central" transform="rotate(-25 141.2 167.2)">☕</text>
      <text x="128.4" y="99.6" font-size="83" text-anchor="middle" dominant-baseline="central" transform="rotate(32 128.4 99.6)">💧</text>
    </g>
        </g>
      </g>
    </g>
  </g>
</svg>
